<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Options Screens</title>
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Options"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<style>
:root{--bg:#0d1117;--panel:#161d27;--line:#273244;--text:#e6edf3;--muted:#8b9bb4;--blue:#59c2ff;--acc:#7aa2ff}
@media (prefers-color-scheme:light){:root{--bg:#f5f7fb;--panel:#fff;--line:#dde3ec;--text:#18202c;--muted:#5d6b80;--blue:#1769c2;--acc:#3557d6}}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));min-height:100vh}
h1{margin:0 0 6px;font-size:22px}p{color:var(--muted);margin:0 0 20px}
.appnav{display:flex;gap:8px;flex-wrap:wrap}
.appnav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;font-weight:600}
.appnav a:hover{border-color:var(--acc)}
.meta{font-size:12px;color:var(--muted);margin-top:28px}
</style></head>
<body>
<h1>Options Screens</h1>
<p>Candidates matching your criteria — not a recommendation.</p>
<nav class="appnav" aria-label="Screens">
  <a href="weekly/">Weekly options screen</a>
  <a href="leaps/">LEAPS screen</a>
</nav>
<p class="meta">On iPhone, open this page in Safari, tap Share, then Add to Home Screen. On Android, use Chrome’s Install app option.</p>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("/options-alerts-dashboard/sw.js",{scope:"/options-alerts-dashboard/"}).catch(function(){})}
</script>
</body></html>
