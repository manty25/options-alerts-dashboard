<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Options Alerts — Day Dashboard</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2332; --line:#2a3548; --text:#e7ecf3; --muted:#8b9bb4;
    --green:#3dd68c; --red:#f07178; --amber:#e6b450; --blue:#59c2ff; --chip:#243044;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:18px; font-weight:600; }
  .meta { color:var(--muted); font-size:12px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:88px; }
  .stat b { display:block; font-size:18px; }
  .stat span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .toolbar { padding:12px 20px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); }
  input, select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  button { background:var(--blue); color:#041018; border:0; border-radius:6px; padding:7px 12px; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--chip); color:var(--text); }
  .wrap { padding:16px 20px 40px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:1100px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); cursor:pointer; white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:hover td { background:#152033; }
  .tix { font-weight:700; color:var(--blue); text-decoration:none; }
  .src { color:var(--muted); font-size:12px; }
  .chip { display:inline-block; padding:2px 7px; border-radius:999px; background:var(--chip); font-size:11px; font-weight:600; }
  .chip.up { background:#163528; color:var(--green); }
  .chip.down { background:#3a1d24; color:var(--red); }
  .chip.inside { background:#2a3140; color:var(--amber); }
  .chip.open { background:#163528; color:var(--green); }
  .chip.exited { background:#3a1d24; color:var(--red); }
  .thin { color:var(--amber); }
  .notes { color:var(--muted); font-size:12px; max-width:220px; }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.day td { background:var(--panel); border-top:2px solid var(--blue); border-bottom:1px solid var(--line); padding:8px 10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--blue); }
  tr.day.prev td { border-top:3px double var(--amber); color:var(--amber); }
  tr.day:hover td, tr.empty:hover td { background:var(--panel); }
  tr.day .lbl, tr.empty .lbl { position:sticky; left:0; display:inline-block; }
  tr.day .cnt { color:var(--muted); font-weight:600; margin-left:8px; text-transform:none; letter-spacing:0; }
  tr.empty td { color:var(--muted); font-style:italic; text-align:left; padding:14px 10px; }
  footer { padding:0 20px 24px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Options Alerts — Day Dashboard</h1>
    <div class="meta" id="updated">Loading…</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar">
  <input id="q" placeholder="Filter ticker or source…" style="min-width:200px"/>
  <select id="status">
    <option value="all">All status</option>
    <option value="open">Open</option>
    <option value="exited">Exited</option>
  </select>
  <select id="strat">
    <option value="all">All Strat</option>
    <option value="aligned">D+W bullish</option>
    <option value="mixed">Mixed / inside</option>
  </select>
  <button class="secondary" id="reload">Reload data</button>
</div>
<div class="wrap">
<table>
  <thead>
    <tr>
      <th data-k="time">Time</th>
      <th data-k="ticker">Ticker</th>
      <th data-k="contract">Contract</th>
      <th data-k="entry">Entry</th>
      <th data-k="otm_pct">OTM%</th>
      <th data-k="mid">Mid / Spread</th>
      <th data-k="vol">Vol / OI</th>
      <th data-k="iv">IV</th>
      <th data-k="impl_move">Impl move</th>
      <th data-k="prev_daily">Prev D</th>
      <th data-k="daily">Daily</th>
      <th data-k="prev_weekly">Prev W</th>
      <th data-k="weekly">Weekly</th>
      <th data-k="status">Status</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
<footer>Numbers only — no advice. Chat stays as short pings; this page is the day board. Reload after new alerts, or leave open and hit Reload.</footer>
<script>
const TV_LAYOUT = localStorage.getItem("tv_layout") || "hOdlnOga";
function tvUrl(ticker) {
  const sym = encodeURIComponent(ticker);
  if (TV_LAYOUT) return `https://www.tradingview.com/chart/${TV_LAYOUT}/?symbol=${sym}`;
  return `https://www.tradingview.com/chart/?symbol=${sym}`;
}
const params = new URLSearchParams(location.search);
if (params.get("layout")) {
  localStorage.setItem("tv_layout", params.get("layout"));
}

let DATA = null;
let sortKey = "time";
let sortDir = -1; // newest first by default

function stratClass(s) {
  if (!s) return "chip";
  if (s.includes("2\u2191") || s.includes("2u") || s.includes("2-up") || s === "3") return "chip up";
  if (s.includes("2\u2193") || s.includes("2d") || s.includes("2-down")) return "chip down";
  return "chip inside";
}
function midSpread(a) {
  if (a.bid == null || a.ask == null) return "—";
  const mid = ((a.bid + a.ask) / 2).toFixed(2);
  const sp = a.spread_pct != null ? a.spread_pct + "%" : "";
  return mid + (sp ? ` <span class="src">(${sp})</span>` : "");
}
function volOi(a) {
  const v = a.vol == null ? "—" : a.vol;
  const o = a.oi == null ? "—" : a.oi;
  const thin = (a.oi != null && a.oi < 100) || (a.vol != null && a.vol < 50);
  return `<span class="${thin ? "thin" : ""}">${v} / ${o}</span>`;
}
function contract(a) {
  return `${a.strike}${a.side === "CALL" ? "C" : "P"} ${a.expiry}`;
}
function aligned(a) {
  const d = (a.daily || "").toLowerCase();
  const w = (a.weekly || "").toLowerCase();
  const up = s => s.includes("2\u2191") || s.includes("2u") || s.includes("2-up") || s === "3" || s.includes("3");
  return up(d) && up(w);
}
function render() {
  if (!DATA) return;
  document.getElementById("updated").textContent = `Today ${DATA.date} · updated ${DATA.updated_pt}` + (DATA.previous && DATA.previous.date ? ` · prev ${DATA.previous.date}` : "");
  const q = document.getElementById("q").value.trim().toLowerCase();
  const st = document.getElementById("status").value;
  const sg = document.getElementById("strat").value;
  function timeMins(t) {
    if (!t) return -1;
    const m = String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!m) return -1;
    let h = parseInt(m[1],10); const min = parseInt(m[2],10); const ap = m[3].toUpperCase();
    if (ap === "PM" && h !== 12) h += 12;
    if (ap === "AM" && h === 12) h = 0;
    return h * 60 + min;
  }
  // filter + sort one day's rows (sorting stays within each day section)
  function prep(list) {
    let rows = (list || []).slice();
    if (q) rows = rows.filter(a => (a.ticker + " " + a.source).toLowerCase().includes(q));
    if (st !== "all") rows = rows.filter(a => a.status === st);
    if (sg === "aligned") rows = rows.filter(aligned);
    if (sg === "mixed") rows = rows.filter(a => !aligned(a));
    rows.sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === "time") { av = timeMins(a.time); bv = timeMins(b.time); }
      if (sortKey === "contract") { av = contract(a); bv = contract(b); }
      if (sortKey === "mid") { av = a.bid==null? -1 : (a.bid+a.ask)/2; bv = b.bid==null? -1 : (b.bid+b.ask)/2; }
      if (typeof av === "string") return av.localeCompare(bv) * sortDir;
      return ((av??-1) - (bv??-1)) * sortDir;
    });
    return rows;
  }
  const todayAll = DATA.alerts || [];
  const prev = DATA.previous && DATA.previous.date ? DATA.previous : null;
  const prevAll = prev ? (prev.alerts || []) : [];
  const rows = prep(todayAll);
  const prevRows = prep(prevAll);
  const filtering = !!q || st !== "all" || sg !== "all";
  const open = todayAll.filter(a => a.status === "open").length;
  const exited = todayAll.filter(a => a.status === "exited").length;
  const thin = todayAll.filter(a => (a.oi!=null && a.oi<100) || (a.vol!=null && a.vol<50)).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${todayAll.length}</b><span>Calls today</span></div>
    <div class="stat"><b>${open}</b><span>Open</span></div>
    <div class="stat"><b>${exited}</b><span>Exited</span></div>
    <div class="stat"><b>${thin}</b><span>Thin liq</span></div>`;
  const NCOL = document.querySelectorAll("thead th").length;
  const nowPT = new Intl.DateTimeFormat("en-CA", {timeZone: "America/Los_Angeles"}).format(new Date());
  const cnt = (shown, total) => `${filtering ? shown + " of " : ""}${total} call${total === 1 ? "" : "s"}`;
  const dayRow = (cls, label, shown, total) =>
    `<tr class="day${cls}"><td colspan="${NCOL}"><span class="lbl">${label}<span class="cnt">${cnt(shown, total)}</span></span></td></tr>`;
  const emptyRow = msg => `<tr class="empty"><td colspan="${NCOL}"><span class="lbl">${msg}</span></td></tr>`;
  const todayTag = DATA.date === nowPT ? "today" : "latest";
  let html = dayRow("", `${dayLabel(DATA.date)} (${todayTag})`, rows.length, todayAll.length);
  if (!todayAll.length) html += emptyRow(todayTag === "today" ? "No calls yet today" : "No calls this session");
  else if (!rows.length) html += emptyRow("No calls match the filters");
  else html += rows.map(rowHtml).join("");
  if (prev) {
    const prevTag = prev.date === addDays(DATA.date, -1) ? "yesterday" : "previous session";
    html += dayRow(" prev", `${dayLabel(prev.date)} (${prevTag})`, prevRows.length, prevAll.length);
    if (!prevAll.length) html += emptyRow("No calls that day");
    else if (!prevRows.length) html += emptyRow("No calls match the filters");
    else html += prevRows.map(rowHtml).join("");
  }
  document.getElementById("rows").innerHTML = html;
}
function dayLabel(iso) {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return iso || "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${+m[2]}/${+m[3]}`;
}
function addDays(iso, n) {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return "";
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n));
  return d.toISOString().slice(0, 10);
}
function rowHtml(a) {
  return `
    <tr>
      <td class="num">${a.time}</td>
      <td><a class="tix" href="${tvUrl(a.ticker)}" target="_blank" rel="noopener" title="Open in TradingView">${a.ticker}</a> <a class="src" href="${a.link}" target="_blank" rel="noopener">src</a><div class="src">${a.source}</div></td>
      <td class="num">${contract(a)}</td>
      <td class="num">${a.entry ?? "—"}</td>
      <td class="num">${a.otm_pct != null ? a.otm_pct + "%" : "—"}</td>
      <td class="num">${midSpread(a)}</td>
      <td class="num">${volOi(a)}</td>
      <td class="num">${a.iv != null ? a.iv + "%" : "—"}</td>
      <td class="num">${a.impl_move || "—"}</td>
      <td><span class="${stratClass(a.prev_daily)}">${a.prev_daily || "—"}</span></td>
      <td><span class="${stratClass(a.daily)}">${a.daily || "—"}</span></td>
      <td><span class="${stratClass(a.prev_weekly)}">${a.prev_weekly || "—"}</span></td>
      <td><span class="${stratClass(a.weekly)}">${a.weekly || "—"}</span></td>
      <td><span class="chip ${a.status}">${a.status}${a.exit != null ? " @" + a.exit : ""}</span></td>
      <td class="notes">${a.notes || ""}</td>
    </tr>`;
}
